[project]
name = "trading-bot"
version = "0.1.0"
description = "국내·미국 주식 자동매매 (신호 알림 → 모의투자 → 실매매)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata",  # Windows에는 시간대 DB가 없어 zoneinfo가 이 패키지를 쓴다
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
