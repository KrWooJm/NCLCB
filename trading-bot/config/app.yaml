# 실행 모드: notify(기본, 텔레그램 신호 알림) | paper(모의투자 주문)
# live(실계좌)는 사용자가 명시적으로 요청하기 전까지 미구현 — 지정하면 시작 시 거부된다.
executor: notify

markets_enabled: [domestic, us]

log:
  level: INFO
  dir: logs
  timezone: Asia/Seoul      # 로그 타임스탬프 표기 시간대
  max_bytes: 5242880        # 5MB
  backup_count: 10

notify:
  telegram_enabled: false   # 5단계(NotifyExecutor)에서 활성화

kis:
  # 시세 조회는 실전 서버 + 실전 앱키(조회 전용). 이 클라이언트는 시세·순위 경로 외 호출을 거부한다.
  # 주문은 6단계에서 모의 서버 + 모의 앱키로만 한다.
  requests_per_second: 10   # 실전 서버 한도(초당 20건)보다 낮게
  max_retries: 3
  timeout_seconds: 10

data:
  dir: data                 # 시세·토큰 캐시 저장 위치 (gitignore 대상)
  backfill_days: 20         # 감시 종목마다 최근 N 평일 중 비어 있는 날을 채운다

collect:
  domestic:
    candidates: 30          # 거래대금 순위 상위 N개 (순위 API는 최대 30개)
    extra_symbols: []       # 항상 수집할 종목코드, 예: ["005930"]
  us:
    exchanges: [NAS, NYS, AMS]
    candidates: 40          # 거래소 합산 거래대금 상위 N개 (3단계 갭 필터 전 후보)
    extra_symbols: []       # "거래소:티커", 예: ["NAS:AAPL"]
